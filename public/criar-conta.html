<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Criar conta - Blue Lock</title>

    <link rel="stylesheet" href="criar-conta.css">
</head>

<body>

    <main class="pagina-login">

        <section class="caixa-login">

            <div class="cabecalho-login">

                <span class="linha"></span>

                <h1>BLUE LOCK</h1>

                <span class="linha"></span>

            </div>

            <h2>CRIAR CONTA</h2>

            <p class="subtitulo">
                Crie sua conta e comece sua jornada.
            </p>

            <form id="formCadastro">

                <div class="campo-login">

                    <label for="nome">Nome</label>

                    <input
                        type="text"
                        id="nome"
                        placeholder="Digite seu nome"
                        required
                    >

                </div>

                <div class="campo-login">

                    <label for="email">E-mail</label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Digite seu e-mail"
                        required
                    >

                </div>

                <div class="campo-login">

                    <label for="senha">Senha</label>

                    <input
                        type="password"
                        id="senha"
                        placeholder="Digite sua senha"
                        required
                        minlength="6"
                    >

                </div>

                <div class="campo-login">

                    <label for="confirmarSenha">
                        Confirmar senha
                    </label>

                    <input
                        type="password"
                        id="confirmarSenha"
                        placeholder="Digite a senha novamente"
                        required
                        minlength="6"
                    >

                </div>

                <button
                    type="submit"
                    class="botao-login"
                >
                    CRIAR CONTA
                </button>

            </form>

            <p id="mensagem-cadastro"></p>

            <a
                href="entrar-conta.html"
                class="link-cadastro"
            >
                JÁ POSSUI UMA CONTA?
                <strong>ENTRAR</strong>
            </a>

            <a
                href="Inicial.html"
                class="voltar"
            >
                ← VOLTAR PARA O INÍCIO
            </a>

        </section>

    </main>

<script src="blue-lock-storage.js"></script>
<script src="criar-conta.js"></script>

</body>

</html>
